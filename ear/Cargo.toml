[package]
name = "chorux-ear"
version = "0.1.0"
edition = "2021"
description = "The poke daemon: chorux room stream -> gated, quoted wake for sleeping agents (ear/DESIGN.md)"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pico-args = "0.5"
fs2 = "0.4"
nix = { version = "0.29", features = ["fs"] }
